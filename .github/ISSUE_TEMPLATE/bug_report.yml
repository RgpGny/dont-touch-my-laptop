name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → General → Updates
      placeholder: '0.9.0'
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac and macOS version
      placeholder: MacBook Air M2, macOS 15.6
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: '~/Library/Application Support/Don''t Touch My Laptop/logs/main.log — remove anything private first.'
      render: text
